[project]
name = "rag"
version = "0.1.0"
description = "RAG system with FastAPI and pipelines"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "beautifulsoup4>=4.14.3",
    "fastembed>=0.8.0",
    "gradio>=6.12.0",
    "huggingface-hub>=1.10.1",
    "langchain-text-splitters>=1.1.1",
    "loguru>=0.7.3",
    "lxml>=6.0.3",
    "markdownify>=1.2.2",
    "opik>=1.11.2",
    "prefect>=3.6.26",
    "psutil>=7.2.2",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.17.1",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]",
]

[dependency-groups]
test = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "responses>=0.25.8",
]

# -----------------------------
# Build system (required)
# -----------------------------
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# -----------------------------
# Tell setuptools where code is
# -----------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
pythonpath = [ "src" ]
python_files = [ "test_*.py" ]
addopts = "-ra -v -s"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
