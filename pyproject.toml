[project]
name = "rag"
version = "0.1.0"
description = "RAG system with FastAPI and pipelines"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

# -----------------------------
# Build system (required)
# -----------------------------
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# -----------------------------
# Tell setuptools where code is
# -----------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]