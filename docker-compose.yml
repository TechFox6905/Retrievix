services:
  # -----------------------------
  # Qdrant Vector Database
  # -----------------------------
  qdrant:
    build:
      context: ./qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  # -----------------------------
  # FastAPI Backend
  # -----------------------------
  backend:
    build:
      context: .
      
      dockerfile: Dockerfile

    container_name: rag-backend
    restart: unless-stopped

    depends_on:
      qdrant:
        condition: service_healthy

    ports:
      - "10000:10000"

    env_file:
      - .env

    environment:
      # Local Qdrant connection
      QDRANT__URL: http://qdrant:6333

      # Cache dirs
      HF_HOME: /tmp/huggingface
      FASTEMBED_CACHE: /tmp/fastembed_cache

      # App config
      PORT: 10000

    volumes:
      - huggingface_cache:/tmp/huggingface
      - fastembed_cache:/tmp/fastembed_cache

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # -----------------------------
  # React Frontend
  # -----------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: rag-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "5173:5173"

    environment:
      VITE_API_BASE_URL: http://localhost:10000

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  qdrant_data:
  huggingface_cache:
  fastembed_cache: